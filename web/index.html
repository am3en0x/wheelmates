<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wheelmates</title>
  <meta name="description" content="Push the wheel with Squeektoshi. A tap game on the live Squeekchain hamster: when he runs, every tap pays more; when a block is found, you get a chest.">
  <meta name="theme-color" content="#0b0a0e">
  <link rel="icon" href="img/wheel-0.png" type="image/png">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <header class="top">
    <div class="live offair" id="live">
      <canvas id="liveWheel" width="30" height="30" aria-hidden="true"></canvas>
      <div class="state"><b id="liveText">Tuning in</b><span id="liveSub">Reading the wheel</span></div>
      <span class="dot" aria-hidden="true"></span>
      <span class="mult num" id="liveMult" title="Tap multiplier right now">×1</span>
    </div>
    <button class="btn small" id="connect">Connect<span class="wide">&nbsp;wallet</span></button>
  </header>

  <main>
    <section class="tab on" id="tab-cage">
      <div class="score">
        <div class="seeds num" id="seedsBox"><img class="px" src="img/seed.png" alt=""><span id="seeds">0</span></div>
        <div class="week" id="week">Connect your wallet to start</div>
      </div>
      <div class="cage-wrap">
        <canvas id="cage" width="360" height="360" aria-label="Squeektoshi's cage. Tap to push the wheel."></canvas>
        <span class="banner" id="banner" hidden></span>
        <button class="chest-btn" id="chestBtn" hidden><img class="px" src="img/chest.png" alt=""><span id="chestText"></span></button>
      </div>
      <div class="energy"><div class="bar"><div class="fill" id="energyFill"></div></div><div class="row"><span class="label">Energy · back 1 a second</span><span class="num" id="energyText">500 / 500</span></div></div>
      <div class="actions">
        <button class="btn solid" id="daily" hidden>Daily bonus</button>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite">Tap the cage to push the wheel. When the real Squeektoshi runs, every tap pays more.</p>
      <div class="foot-links">
        <a class="quiet" href="about.html">About</a>
        <button class="quiet" id="signout" hidden>Sign out</button>
      </div>
    </section>

    <nav class="tabs" aria-label="Sections">
      <button class="on" data-tab="cage">Cage</button>
      <button data-tab="upgrades">Upgrades</button>
      <button data-tab="friends">Friends</button>
      <button data-tab="leaders">Leaders</button>
    </nav>

    <section class="tab" id="tab-upgrades">
      <div class="tab-head sticky"><h1>Upgrades</h1><span class="balance num"><img class="px" src="img/seed.png" alt="">&nbsp;<span id="balance">0</span></span></div>
      <div id="upgrades"></div>
    </section>

    <section class="tab" id="tab-friends">
      <div class="tab-head"><h1>Friends</h1></div>
      <div id="friends"></div>
      <form class="card" id="nameForm"><div class="label">Your name on the board</div><div class="copy"><input id="nameInput" maxlength="20" placeholder="3 to 20 characters" aria-label="Display name"><button class="btn small" type="submit">Save</button></div></form>
    </section>

    <section class="tab" id="tab-leaders">
      <div class="tab-head"><h1>Leaders</h1><span class="label" id="leadersTitle"></span></div>
      <div class="seg"><button class="on" data-scope="season">This week</button><button data-scope="all">All time</button></div>
      <div id="leaders"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
